<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON RING · Remote</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #pad{position:relative;overflow:hidden;touch-action:none}
  /* 연결 상태: 연결 전/끊김일 때만 보이고, 연결되면 잠깐 뒤 사라짐 */
  #st{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;
    font:500 13px/1 system-ui,sans-serif;letter-spacing:.06em;color:#7fdcff;
    pointer-events:none;transition:opacity .8s;z-index:2}
  #st.bad{color:#ff7b7b}
  #st.off{opacity:0}
  .ring{position:absolute;border-radius:50%;box-sizing:border-box;border:4px solid #b8f1ff;
    box-shadow:0 0 8px #4fd8ff,0 0 22px #4fd8ff,inset 0 0 8px #4fd8ff;
    transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;
    animation:pop 1.2s ease-out forwards}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
    30%{transform:translate(-50%,-50%) scale(1)}
    100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="st">연결 중…</div>
<div id="wrap"><div id="pad"></div></div>

<script>
const AR = 1920 / 2795;          // 대형 화면 비율과 동일하게 매핑
const RING_RATIO = 200 / 1920;   // display.html radius / W
const pad = document.getElementById('pad');
const st = document.getElementById('st');

function fit(){
  let w = innerWidth, h = innerHeight;
  if (w / h > AR) w = h * AR; else h = w / AR;
  pad.style.width = w + 'px'; pad.style.height = h + 'px';
}
addEventListener('resize', fit); fit();

let hideT = null;
function status(t, bad, autoHide){
  clearTimeout(hideT);
  st.textContent = t;
  st.classList.toggle('bad', !!bad);
  st.classList.remove('off');
  if (autoHide) hideT = setTimeout(() => st.classList.add('off'), 1200);
}

/* 연결 대상: ?id=(예전 QR) 또는 ?room= 또는 기본 방 */
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'aplan-neonring').replace(/[^a-z0-9-]/gi, '');
const TARGET = params.get('id') || ('nr-' + ROOM);

let peer = null, conn = null, retryT = null, openT = null;
const queue = [];

function scheduleRetry(ms){
  clearTimeout(retryT);
  retryT = setTimeout(connect, ms);
}

function connect(){
  clearTimeout(retryT); clearTimeout(openT);
  if (!peer || peer.destroyed){ startPeer(); return; }
  if (peer.disconnected){ peer.reconnect(); return; }
  if (conn) try { conn.close(); } catch(e){}
  status('화면에 연결 중…');
  const c = peer.connect(TARGET, { reliable: true });
  conn = c;
  // 6초 안에 안 열리면 다시 시도
  openT = setTimeout(() => { if (!c.open){ status('화면을 찾는 중… (화면이 켜져 있나요?)', true); scheduleRetry(500); } }, 6000);
  c.on('open', () => {
    clearTimeout(openT);
    status('● 연결됨', false, true);
    while (queue.length) c.send(queue.shift());
  });
  c.on('close', () => { if (conn === c){ status('연결 끊김 · 재연결 중…', true); scheduleRetry(1500); } });
  c.on('error', () => { if (conn === c){ status('연결 오류 · 재시도 중…', true); scheduleRetry(2000); } });
}

function startPeer(){
  if (peer && !peer.destroyed) peer.destroy();
  status('서버 연결 중…');
  peer = new Peer();
  peer.on('open', connect);
  peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable'){
      status('화면을 찾는 중… (화면이 켜져 있나요?)', true);
      scheduleRetry(2500);
    } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)){
      status('네트워크 오류 · 재시도 중…', true);
      setTimeout(startPeer, 3000);
    } else {
      status('연결 오류(' + err.type + ') · 재시도 중…', true);
      scheduleRetry(2500);
    }
  });
}
startPeer();

// 앱 전환 후 돌아오면 재연결
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !(conn && conn.open)) connect();
});

/* 터치 → 도넛 */
function fx(x, y, w){
  const d = w * RING_RATIO * 2;
  const el = document.createElement('div');
  el.className = 'ring';
  el.style.cssText = `left:${x}px;top:${y}px;width:${d}px;height:${d}px`;
  pad.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = pad.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  fx(px, py, r.width);
  const msg = { t: 'tap', x: px / r.width, y: py / r.height };
  if (conn && conn.open) conn.send(msg);
  else if (queue.length < 10) queue.push(msg);
  if (navigator.vibrate) navigator.vibrate(12);
});
</script>
</body>
</html>
